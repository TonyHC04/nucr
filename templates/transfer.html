{% extends "base.html" %}

{% block title %}Transfer{% endblock %}

{% block content %}
<div class="transfer">
    <h2>Transfer {{ cryptoSymbol }}</h2>
    
    <div class="card">
        <div class="balance-info">
            <p>Available Balance: <strong>{{ "%.2f"|format(wallet.balance) }} {{ cryptoSymbol }}</strong></p>
            <p>≈ ${{ "%.2f"|format(wallet.balance * get_current_crypto_price()) }}</p>
        </div>
        
        <form method="POST" action="{{ url_for('transfer') }}">
            <div class="form-group">
                <label for="recipient">Recipient Username</label>
                <input type="text" id="recipient" name="recipient" required>
            </div>
            <div class="form-group">
                <label for="amount">Amount ({{ cryptoSymbol }})</label>
                <input type="number" id="amount" name="amount" step="0.01" min="0.01" required>
            </div>
            <div class="form-group">
                <label for="description">Description (Optional)</label>
                <input type="text" id="description" name="description">
            </div>
            <button type="submit" class="btn">Send {{ cryptoSymbol }}</button>
        </form>
    </div>
</div>
{% endblock %}
